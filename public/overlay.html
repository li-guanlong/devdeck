<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <title>DevDeck 悬浮卡片</title>
  <style>
    /* ===== 悬浮卡片样式：透明底 + 半透明玻璃，跟随明暗主题（CSS 变量） ===== */
    /* 默认：深色主题（与主看板 dark 一致） */
    :root {
      --panel-bg: rgba(18, 24, 34, 0.9);
      --panel-border: rgba(148, 163, 184, 0.22);
      --head-border: rgba(148, 163, 184, 0.14);
      --txt: #e2e8f0;
      --mut: #7d8aa0;
      --foot: #5f6c80;
      --acc: #22d3ee;
      --ok: #34d399;
      --warn: #fbbf24;
      --err: #f87171;
      --itembg: rgba(148, 163, 184, 0.06);
      --item-border: rgba(148, 163, 184, 0.1);
      --item-border-hover: rgba(34, 211, 238, 0.3);
      --chip: rgba(148, 163, 184, 0.16);
      --port-bg: rgba(56, 189, 248, 0.12);
      --port-border: rgba(56, 189, 248, 0.25);
      --btn-border: rgba(148, 163, 184, 0.3);
      --btn-hover-border: rgba(34, 211, 238, 0.5);
      --open-bg: rgba(34, 211, 238, 0.15);
      --kill-bg: rgba(248, 113, 113, 0.15);
      --scroll: rgba(148, 163, 184, 0.25);
    }

    /* 亮色主题（主看板 localStorage devdeck_theme=light 时生效） */
    [data-theme="light"] {
      --panel-bg: rgba(255, 255, 255, 0.94);
      --panel-border: rgba(15, 40, 70, 0.18);
      --head-border: rgba(15, 40, 70, 0.1);
      --txt: #16233a;
      --mut: #5d6f88;
      --foot: #5d6f88;
      --acc: #0284a8;
      --ok: #0a9b6c;
      --warn: #b45309;
      --err: #dc2626;
      --itembg: rgba(15, 40, 70, 0.05);
      --item-border: rgba(15, 40, 70, 0.1);
      --item-border-hover: rgba(2, 132, 168, 0.35);
      --chip: rgba(15, 40, 70, 0.12);
      --port-bg: rgba(2, 132, 168, 0.1);
      --port-border: rgba(2, 132, 168, 0.28);
      --btn-border: rgba(15, 40, 70, 0.18);
      --btn-hover-border: rgba(2, 132, 168, 0.5);
      --open-bg: rgba(2, 132, 168, 0.12);
      --kill-bg: rgba(220, 38, 38, 0.1);
      --scroll: rgba(15, 40, 70, 0.22);
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: transparent;
      overflow: hidden;
      font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    /* 整个卡片可拖动；内部按钮/链接区域禁止拖动 */
    #card {
      box-sizing: border-box;
      width: 100vw;
      height: 100vh;
      padding: 10px;
      -webkit-app-region: drag;
    }

    #card.no-drag,
    #card .no-drag,
    #card button,
    #card a,
    #card .interactive {
      -webkit-app-region: no-drag;
    }

    .panel {
      box-sizing: border-box;
      width: 100%;
      height: 100%;
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 14px;
      backdrop-filter: blur(12px);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      color: var(--txt);
      transition: background .25s, border-color .25s, color .25s;
    }

    /* 头部：标题 + 服务数 + 操作 */
    .head {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 9px 12px;
      border-bottom: 1px solid var(--head-border);
      flex: none;
    }

    .head .logo {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--ok);
      box-shadow: 0 0 8px rgba(52, 211, 153, 0.9);
      flex: none;
    }

    .head .ttl {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1px;
      flex: none;
    }

    .head .cnt {
      font-size: 10px;
      color: var(--mut);
      background: var(--chip);
      border-radius: 8px;
      padding: 1px 7px;
      font-family: Consolas, monospace;
    }

    .head .spacer {
      flex: 1;
    }

    .head .hbtn {
      -webkit-app-region: no-drag;
      background: transparent;
      border: 1px solid var(--btn-border);
      color: var(--mut);
      border-radius: 6px;
      font-size: 14px;
      width: 26px;
      height: 26px;
      line-height: 1;
      cursor: pointer;
      padding: 0;
      transition: .15s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .head .hbtn:hover {
      color: var(--acc);
      border-color: var(--btn-hover-border);
    }

    .head .hbtn.pin.on {
      color: var(--warn);
      border-color: rgba(251, 191, 36, 0.5);
    }

    /* 服务列表 */
    .list {
      flex: 1;
      overflow-y: auto;
      padding: 6px 8px;
      -webkit-app-region: no-drag;
    }

    .list::-webkit-scrollbar {
      width: 5px;
    }

    .list::-webkit-scrollbar-thumb {
      background: var(--scroll);
      border-radius: 3px;
    }

    .item {
      display: flex;
      flex-direction: column;
      gap: 5px;
      padding: 8px 10px;
      border-radius: 8px;
      background: var(--itembg);
      border: 1px solid var(--item-border);
      margin-bottom: 6px;
      transition: border-color .15s, background .25s;
    }

    .item:hover {
      border-color: var(--item-border-hover);
    }

    /* 行1：项目名 + 端口 + 操作按钮 */
    .item .row1 {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .item .nm {
      flex: 1;
      min-width: 0;
    }

    .item .nm b {
      font-size: 12px;
      display: block;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .item .nm .pid {
      font-size: 9.5px;
      color: var(--mut);
      font-family: Consolas, monospace;
      margin-top: 1px;
    }

    .item .port {
      flex: none;
      font-size: 10px;
      color: var(--acc);
      font-family: Consolas, monospace;
      background: var(--port-bg);
      border: 1px solid var(--port-border);
      border-radius: 8px;
      padding: 1px 7px;
    }

    .item .ops {
      display: flex;
      gap: 4px;
      flex: none;
    }

    /* 行2：资源信息独占整行，不再被按钮挤压（修复 CPU 遮挡） */
    .item .row2 {
      display: flex;
      align-items: center;
      min-width: 0;
    }

    .item .meta {
      flex: 1;
      display: flex;
      gap: 10px;
      font-size: 10px;
      color: var(--mut);
      font-family: Consolas, monospace;
      white-space: nowrap;
      min-width: 0;
    }

    .item .meta b {
      color: var(--txt);
      font-weight: 600;
    }

    .item .ibtn {
      -webkit-app-region: no-drag;
      background: transparent;
      border: 1px solid;
      border-radius: 5px;
      font-size: 9.5px;
      line-height: 1.2;
      cursor: pointer;
      padding: 2px 6px;
      transition: .15s;
      color: var(--mut);
      border-color: var(--btn-border);
      white-space: nowrap;
    }

    .item .ibtn.open {
      color: var(--acc);
      border-color: rgba(2, 132, 168, 0.4);
    }

    .item .ibtn.open:hover {
      background: var(--open-bg);
    }

    .item .ibtn.reboot {
      color: var(--ok);
      border-color: rgba(10, 155, 108, 0.4);
    }

    .item .ibtn.reboot:hover {
      background: var(--ok);
      color: #fff;
    }

    .item .ibtn.kill {
      color: var(--err);
      border-color: rgba(248, 113, 113, 0.4);
    }

    .item .ibtn.kill:hover {
      background: var(--kill-bg);
    }

    .item .ibtn:disabled {
      opacity: .5;
      cursor: wait;
    }

    .empty {
      text-align: center;
      color: var(--mut);
      font-size: 11px;
      padding: 16px 8px;
    }

    .foot {
      flex: none;
      padding: 6px 12px;
      border-top: 1px solid var(--head-border);
      font-size: 9.5px;
      color: var(--foot);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .foot .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--ok);
      flex: none;
    }

    .foot .tm {
      margin-left: auto;
      font-family: Consolas, monospace;
    }

    /* 折叠模式已移除：窗口高度改为按内容自适应，见 main.js 的 setOverlayHeight */

    /* 吸附按钮与头部 hbtn 同尺寸 */
    .dock-toggle {
      font-size: 14px;
      line-height: 1;
    }

    .dock-toggle:hover {
      color: var(--acc);
      border-color: var(--btn-hover-border);
    }

    /* 卡内操作提示：悬浮窗独立反馈，3.2s 自动消失 */
    .toast {
      position: fixed;
      left: 50%;
      bottom: 16px;
      transform: translateX(-50%) translateY(8px);
      max-width: 88vw;
      padding: 6px 10px;
      border-radius: 8px;
      background: var(--panel-bg);
      border: 1px solid var(--btn-hover-border);
      color: var(--txt);
      font-size: 11px;
      line-height: 1.4;
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity .18s, transform .18s;
      z-index: 9;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ===== 极简停靠形态：贴边一条渐变胶囊 + 中间高光，鼠标靠近自动展开 ===== */
    .dock-tab {
      display: none;
      position: fixed;
      inset: 0;
      cursor: pointer;
      -webkit-app-region: no-drag; /* 细条改为点击展开，不能再吞掉鼠标事件 */
    }

    body.docked-ui #card { display: none; }

    body.docked-ui .dock-tab { display: block; }

    .dock-tab::before {
      content: '';
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      border-radius: 999px;
      background: linear-gradient(180deg, #67e8f9 0%, #22d3ee 30%, #6366f1 72%, #a78bfa 100%);
      box-shadow:
        0 0 6px rgba(34, 211, 238, .55),
        0 0 18px rgba(99, 102, 241, .35),
        inset 0 0 3px rgba(255, 255, 255, .7);
      opacity: .9;
      transition: width .18s ease, height .18s ease, opacity .18s ease, box-shadow .18s ease, transform .18s ease;
      animation: dockBreathe 3.6s ease-in-out infinite;
    }

    /* 胶囊中间的一道细高光，让"极简条"更像一个可抓的把手 */
    .dock-tab::after {
      content: '';
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      border-radius: 999px;
      background: rgba(255, 255, 255, .92);
      box-shadow: 0 0 6px rgba(255, 255, 255, .85);
      opacity: .8;
      transition: opacity .18s ease, transform .18s ease, box-shadow .18s ease;
    }

    body.dock-left .dock-tab::before,
    body.dock-right .dock-tab::before {
      width: 8px;
      height: 76px;
    }

    body.dock-left .dock-tab::after,
    body.dock-right .dock-tab::after {
      width: 2px;
      height: 22px;
    }

    body.dock-top .dock-tab::before,
    body.dock-bottom .dock-tab::before {
      width: 76px;
      height: 8px;
      background: linear-gradient(90deg, #67e8f9 0%, #22d3ee 30%, #6366f1 72%, #a78bfa 100%);
    }

    body.dock-top .dock-tab::after,
    body.dock-bottom .dock-tab::after {
      width: 22px;
      height: 2px;
    }

    /* 悬停高亮：原生 :hover + 主进程光标轮询（is-hover）双保险 */
    .dock-tab:hover::before,
    .dock-tab.is-hover::before {
      opacity: 1;
      animation-play-state: paused;
      transform: translate(-50%, -50%) scale(1.18);
      box-shadow:
        0 0 10px rgba(34, 211, 238, .8),
        0 0 26px rgba(99, 102, 241, .6),
        inset 0 0 3px rgba(255, 255, 255, .9);
    }

    .dock-tab:hover::after,
    .dock-tab.is-hover::after {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1.2);
      box-shadow: 0 0 10px rgba(255, 255, 255, .95);
    }

    @keyframes dockBreathe {
      0%, 100% { opacity: .82; }
      50% { opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      .dock-tab::before { animation: none; }
    }
    /* ===== 打开地址：卡内内联列表（左键打开 / 右键复制） ===== */
    .item .urls {
      display: flex;
      flex-direction: column;
      gap: 3px;
      margin-top: 1px;
      padding: 4px;
      border-radius: 6px;
      background: var(--itembg);
      border: 1px dashed var(--item-border-hover);
      -webkit-app-region: no-drag;
    }
    .item .urls[hidden] { display: none; }
    .item .url-row {
      -webkit-app-region: no-drag;
      display: flex;
      align-items: center;
      gap: 6px;
      width: 100%;
      text-align: left;
      background: transparent;
      border: 1px solid transparent;
      border-radius: 5px;
      color: var(--acc);
      font-size: 10px;
      font-family: Consolas, monospace;
      padding: 3px 6px;
      cursor: pointer;
      transition: .15s;
    }
    .item .url-row .u {
      flex: 1;
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .item .url-row .hint {
      flex: none;
      font-size: 9px;
      color: var(--mut);
      opacity: 0;
      transition: opacity .15s;
    }
    .item .url-row:hover {
      background: var(--open-bg);
      border-color: var(--item-border-hover);
      color: var(--txt);
    }
    .item .url-row:hover .hint { opacity: 1; }
    .item .ibtn.open.on {
      background: var(--open-bg);
      border-color: var(--btn-hover-border);
    }
  </style>
</head>

<body>
  <div id="card">
    <div class="panel">
      <div class="head">
        <span class="logo"></span>
        <span class="ttl">DEV<span style="color:var(--acc)">·</span>DECK</span>
        <span class="cnt" id="cnt">0</span>
        <span class="spacer"></span>
        <button class="hbtn dock-toggle" id="dockBtn" title="吸附到屏幕边缘">🧲</button>
        <button class="hbtn theme" id="theme" title="切换主题">🌙</button>
        <button class="hbtn pin" id="pin" title="置顶开关">📌</button>
        <button class="hbtn" id="close" title="隐藏悬浮卡片">✕</button>
      </div>
      <div class="list" id="list"></div>
      <div class="foot">
        <span class="dot"></span>
        <span id="state">连接中…</span>
        <span class="tm" id="tm">--</span>
      </div>
    </div>
  </div>

  <div class="dock-tab" id="dockTab" title="DevDeck · 点击展开" aria-hidden="true"></div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="sanitize.js"></script>
  <script src="overlay.js"></script>
</body>

</html>
